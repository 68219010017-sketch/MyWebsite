<!DOCTYPE html>
<html>
    <head>
        <title>back to top</title>
        <style>
            body{
                margin: 0;
                padding: 0;
                background: transparent;
            }
            #backToTopBtn{
                width: 100%;
                height: 100%;
                padding: 8px 12px;
                font-size: 14px;
                color: #fff;
                background-color: #333;
                border: none;
                border-radius: 20px; 
                cursor: pointer;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            }
            #backToTopBtn:hover{
                background-color: aqua;
            }
        </style>
    </head>
    <body>
        <button id="backToTopBtn" onclick="goTop()">Top</button>
        <script>
            function goTop(){
                window.top.scrollTo({
                    top:0,
                    behavior:'smooth'
                });
            }
        </script>
    </body>
</html>
